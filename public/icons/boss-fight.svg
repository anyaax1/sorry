<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Retro arcade boss / ego monster -->
  <!-- Horns / Crown -->
  <polygon points="8,10 6,4 11,8" fill="#ff2222" stroke="#000" stroke-width="0.5"/>
  <polygon points="24,10 26,4 21,8" fill="#ff2222" stroke="#000" stroke-width="0.5"/>
  <polygon points="16,8 16,3 18,7" fill="#ffd700" stroke="#000" stroke-width="0.5"/>
  <!-- Puffed ego face / body -->
  <circle cx="16" cy="17" r="11" fill="#7b1fa2" stroke="#000" stroke-width="1"/>
  <!-- Angry eyebrows -->
  <line x1="10" y1="12" x2="14" y2="14" stroke="#000" stroke-width="2"/>
  <line x1="22" y1="12" x2="18" y2="14" stroke="#000" stroke-width="2"/>
  <!-- Eyes -->
  <circle cx="12" cy="16" r="2.5" fill="#fff"/>
  <circle cx="12" cy="16" r="1.2" fill="#ff0000"/>
  <circle cx="20" cy="16" r="2.5" fill="#fff"/>
  <circle cx="20" cy="16" r="1.2" fill="#ff0000"/>
  <!-- Smug / stubborn mouth -->
  <path d="M 12 22 Q 16 20 20 22" fill="none" stroke="#fff" stroke-width="1.5"/>
  <!-- Sword / heart badge underneath -->
  <rect x="6" y="27" width="20" height="3" fill="#ff4081" stroke="#000" stroke-width="0.5"/>
</svg>
