<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Vending machine body -->
  <rect x="5" y="2" width="22" height="28" rx="2" fill="#c0c0c0" stroke="#000" stroke-width="1"/>
  <!-- Glass display area -->
  <rect x="7" y="4" width="13" height="18" fill="#e6f2ff" stroke="#000" stroke-width="0.5"/>
  <!-- Glass reflection -->
  <line x1="8" y1="5" x2="18" y2="15" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Shelves -->
  <line x1="7" y1="10" x2="20" y2="10" stroke="#808080" stroke-width="1"/>
  <line x1="7" y1="16" x2="20" y2="16" stroke="#808080" stroke-width="1"/>
  <!-- Candies/items on shelf -->
  <circle cx="10" cy="8" r="2" fill="#ff4d4d"/>
  <circle cx="16" cy="8" r="2" fill="#ffd700"/>
  <rect x="9" y="12" width="4" height="3" fill="#32cd32"/>
  <rect x="15" y="12" width="4" height="3" fill="#ff69b4"/>
  <!-- Keypad / coin panel -->
  <rect x="21" y="4" width="5" height="10" fill="#404040"/>
  <rect x="22" y="6" width="3" height="1" fill="#00ff00"/> <!-- Display -->
  <circle cx="23.5" cy="9" r="0.8" fill="#c0c0c0"/>
  <circle cx="23.5" cy="11.5" r="0.8" fill="#c0c0c0"/>
  <!-- Coin slot -->
  <line x1="22.5" y1="16" x2="24.5" y2="16" stroke="#000" stroke-width="1"/>
  <!-- Dispense flap at bottom -->
  <rect x="8" y="24" width="16" height="5" fill="#202020" stroke="#000" stroke-width="0.5"/>
  <rect x="10" y="25" width="12" height="3" fill="#404040"/>
</svg>
